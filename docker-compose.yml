# MomCitas - Docker Compose
# PostgreSQL + Next.js app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momcitas}
      POSTGRES_DB: momcitas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-momcitas}@db:5432/momcitas
      NODE_ENV: production
    env_file: .env
    ports:
      - ${APP_PORT:-3000}:3000
    networks:
      - app-net

volumes:
  db-data:

networks:
  app-net:
